version: 2

project_name: mtrx

before:
  hooks:
    - go mod download

builds:
  - id: mtrx
    main: .
    binary: mtrx
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing

changelog:
  abbrev: 7
  sort: asc
  format: "{{.SHA}}: {{.Message}}"
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
